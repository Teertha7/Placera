server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: placera-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/placera_db}
    username: ${SPRING_DATASOURCE_USERNAME:placera_user}
    password: ${SPRING_DATASOURCE_PASSWORD:placera_secure_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# Security & JWT Configuration
placera:
  jwt:
    # 256-bit or greater secure secret key
    secret: ${PLACERA_JWT_SECRET:4c61636572615365637572654a57545365637265744b657932303236466f7243616d707573}
    access-token-expiration-ms: ${PLACERA_JWT_ACCESS_EXP:86400000} # 24 hours
    refresh-token-expiration-ms: ${PLACERA_JWT_REFRESH_EXP:604800000} # 7 days
    cookie-name: placera_token
  cors:
    allowed-origins: ${PLACERA_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  storage:
    type: ${PLACERA_STORAGE_TYPE:local} # local or azure
    local-dir: ${PLACERA_UPLOAD_DIR:./uploads/resumes}
  admin:
    bootstrap-email: ${PLACERA_ADMIN_EMAIL:admin@placera.edu}
    bootstrap-password: ${PLACERA_ADMIN_PASSWORD:AdminPlacera#2026!}
    bootstrap-first-name: ${PLACERA_ADMIN_FIRSTNAME:Placement}
    bootstrap-last-name: ${PLACERA_ADMIN_LASTNAME:Dean}

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.placera: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
