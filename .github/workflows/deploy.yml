name: Continuous Deployment (Azure Cloud)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-and-deploy:
    name: Conditional Azure Cloud Deployment
    runs-on: ubuntu-latest
    # Skip deployment if Azure credentials are not configured in repository secrets
    if: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 & Build Backend
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile & Test Backend
        run: |
          cd backend
          mvn clean package --batch-mode

      - name: Set up Node.js 22 & Build Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

      - name: Authenticate to Azure via GitHub OIDC Federation
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ vars.AZURE_CONTAINER_REGISTRY }}

      - name: Build and Push Backend Docker Image to ACR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/placera-backend:${{ github.sha }}

      - name: Deploy Backend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/placera-backend:${{ github.sha }}
          containerAppName: placera-backend-app
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}

      - name: Deploy Frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: "dist"
