name: Continuous Deployment (Azure Cloud)

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-backend:
    name: Deploy Backend (ACR & Azure Container Apps)
    runs-on: ubuntu-latest
    # Execute only after successful CI on main, and only when Azure OIDC credentials are configured in repository variables
    if: >-
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') ||
       github.event_name == 'workflow_dispatch') &&
      vars.AZURE_CLIENT_ID != '' &&
      vars.AZURE_TENANT_ID != '' &&
      vars.AZURE_SUBSCRIPTION_ID != ''

    steps:
      - name: Resolve Target Git Commit SHA
        id: commit_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TARGET_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            TARGET_SHA="${{ github.sha }}"
          fi
          echo "sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo ${TARGET_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit_meta.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Azure via GitHub OIDC Federation
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ vars.AZURE_CONTAINER_REGISTRY }}

      - name: Build and Push Backend Docker Image to ACR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/placera-backend:${{ steps.commit_meta.outputs.sha }}
            ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/placera-backend:${{ steps.commit_meta.outputs.short_sha }}
            ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/placera-backend:latest

      - name: Deploy Backend Revision to Azure Container Apps
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/placera-backend:${{ steps.commit_meta.outputs.sha }}"

  deploy-frontend:
    name: Deploy Frontend (Azure Static Web Apps)
    runs-on: ubuntu-latest
    # Execute only after successful CI on main (or manual dispatch). Secrets are evaluated safely in steps.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Check Azure Static Web Apps Token Configuration
        id: check_token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$SWA_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "Azure Static Web Apps deployment token detected."
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Frontend Deployment Skipped::AZURE_STATIC_WEB_APPS_API_TOKEN is not configured in repository secrets. Skipping frontend deployment."
          fi

      - name: Resolve Target Git Commit SHA
        if: steps.check_token.outputs.has_token == 'true'
        id: commit_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TARGET_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            TARGET_SHA="${{ github.sha }}"
          fi
          echo "sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout Source Code
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit_meta.outputs.sha }}

      - name: Set up Node.js 22
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Build Frontend Bundle
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy Frontend to Azure Static Web Apps
        if: steps.check_token.outputs.has_token == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: "dist"
          skip_app_build: true
