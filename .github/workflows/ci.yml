name: Continuous Integration

on:
  push:
    branches: [ main, master, 'feat/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          mvn clean test --batch-mode

      - name: Package Backend Spring Boot Artifact
        run: |
          cd backend
          mvn package -DskipTests --batch-mode

      - name: Upload Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: placera-backend-jar
          path: backend/target/*.jar
          retention-days: 5

  frontend-ci:
    name: Frontend Lint, Typecheck & Tests (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests (Vitest)
        run: |
          cd frontend
          npm test

      - name: Compile & Typecheck Frontend (Vite & TypeScript)
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: placera-frontend-dist
          path: frontend/dist
          retention-days: 5

  docker-build-verification:
    name: Docker Image Build Verification
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: placera-backend:ci-test

      - name: Verify Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: placera-frontend:ci-test
